<!doctype html>
<html lang="en">
<head>
    <title>ID5 Prebid Enabler — reconfigure with an ID5 ID served</title>
    <link rel="canonical" href="https://www.id5.io"/>
</head>
<body>

<script src="https://cdn.delivrfy.cloud/test/pbjsStub.js"></script>
<script>
    window.pbjsStub.init();
    pbjs.userIds = {id5id: {uid: 'ID5*served'}};
    // the ID5 module reporting the ID it provided on this page view
    window.id5Prebid = {integration: {userIdReady: true}};
    pbjs.setConfig({
        userSync: {
            userIds: [
                {
                    name: 'id5Id',
                    params: {partner: 99, externalModuleUrl: 'https://blocked.example.net/id5PrebidModule.js'},
                    storage: {type: 'html5', name: 'id5id', expires: 30}
                }
            ]
        }
    });
</script>

<script src="https://cdn.delivrfy.cloud/api/integration/id5-prebid-enabler.js"></script>
<script>
    window.reconfigured = window.id5PrebidEnabler.reconfigureUserIdModule();
</script>

</body>
</html>
