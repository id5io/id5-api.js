<!doctype html>
<html lang="en">
<head>
    <title>ID5 Prebid Enabler — reconfigure before Prebid</title>
    <link rel="canonical" href="https://www.id5.io"/>
</head>
<body>

<script src="https://cdn.id5-sync.com/api/integration/id5-prebid-enabler.js"></script>
<script>
    window.reconfigured = window.id5Prebid.enabler.reconfigureUserIdModule();
</script>

<script src="https://cdn.id5-sync.com/test/pbjsStub.js"></script>
<script>
    window.pbjsStub.init();
    // The page configures ID5 only once Prebid is up, and a second later than the enabler asked.
    setTimeout(function () {
        pbjs.setConfig({
            userSync: {
                auctionDelay: 300,
                userIds: [
                    {name: 'sharedId'},
                    {
                        name: 'id5Id',
                        params: {partner: 99, pd: 'publisher-pd', externalModuleUrl: 'https://blocked.example.net/id5PrebidModule.js'},
                        storage: {type: 'html5', name: 'id5id', expires: 30}
                    }
                ]
            }
        });
    }, 1000);
</script>

</body>
</html>
