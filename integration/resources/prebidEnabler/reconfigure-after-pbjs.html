<!doctype html>
<html lang="en">
<head>
    <title>ID5 Prebid Enabler — reconfigure after Prebid</title>
    <link rel="canonical" href="https://www.id5.io"/>
</head>
<body>

<script src="https://cdn.delivrfy.cloud/test/pbjsStub.js"></script>
<script>
    window.pbjsStub.init();
    pbjs.setConfig({
        userSync: {
            auctionDelay: 300,
            filterSettings: {image: {bidders: '*', filter: 'include'}},
            userIds: [
                {name: 'sharedId'},
                {
                    name: 'id5Id',
                    params: {partner: 99, pd: 'publisher-pd', externalModuleUrl: 'https://blocked.example.net/id5PrebidModule.js'},
                    storage: {type: 'html5', name: 'id5id', expires: 30},
                    bidders: ['appnexus']
                }
            ]
        }
    });
</script>

<script src="https://cdn.delivrfy.cloud/api/integration/id5-prebid-enabler.js"></script>
<script>
    window.reconfigured = window.id5PrebidEnabler.reconfigureUserIdModule();
</script>

</body>
</html>
